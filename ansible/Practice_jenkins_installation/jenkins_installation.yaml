
---

# ============================================================
# 1. Install Docker on AWS EC2
# ============================================================

- name: Install Docker on AWS EC2
  hosts: aws
  become: yes

  tasks:

    - name: Update DNF cache
      ansible.builtin.dnf:
        update_cache: yes

    - name: Install Docker
      ansible.builtin.dnf:
        name: docker
        state: present


# ============================================================
# 2. Configure Docker
# ============================================================

- name: Configure Docker
  hosts: aws
  become: yes

  tasks:

    - name: Start and enable Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create Docker group
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add ec2-user to Docker group
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Reconnect to server to apply Docker group changes
      ansible.builtin.meta:
        reset_connection


# ============================================================
# 3. Get Docker Socket GID
# ============================================================

- name: Get Docker socket information
  hosts: aws
  become: yes

  tasks:

    - name: Check Docker socket
      ansible.builtin.stat:
        path: /var/run/docker.sock
      register: docker_socket

    - name: Display Docker socket GID
      ansible.builtin.debug:
        msg: "Docker socket GID: {{ docker_socket.stat.gid }}"


# ============================================================
# 4. Install and Run Jenkins
# ============================================================

- name: Install and Run Jenkins
  hosts: aws
  become: yes

  tasks:

    - name: Pull Jenkins LTS JDK 21 image
      community.docker.docker_image:
        name: jenkins/jenkins
        tag: lts-jdk21
        source: pull

    - name: Create Jenkins persistent volume
      community.docker.docker_volume:
        name: jenkins_home

    - name: Run Jenkins container
      community.docker.docker_container:
        name: jenkins
        image: jenkins/jenkins:lts-jdk21

        state: started

        restart_policy: unless-stopped

        ports:
          - "8080:8080"
          - "50000:50000"

        volumes:
          # Jenkins persistent data
          - jenkins_home:/var/jenkins_home

          # Docker-outside-of-Docker
          - /var/run/docker.sock:/var/run/docker.sock

        # Give Jenkins access to the host Docker socket group
        groups:
          - "{{ docker_socket.stat.gid }}"


# ============================================================
# 5. Install Docker CLI inside Jenkins
# ============================================================

- name: Install Docker CLI inside Jenkins
  hosts: aws
  become: yes

  tasks:

    - name: Update package repository inside Jenkins
      community.docker.docker_container_exec:
        container: jenkins
        command: apt-get update
        user: root

    - name: Install Docker CLI
      community.docker.docker_container_exec:
        container: jenkins
        command: apt-get install -y docker.io
        user: root

    - name: Verify Docker CLI
      community.docker.docker_container_exec:
        container: jenkins
        command: docker --version
        user: root

