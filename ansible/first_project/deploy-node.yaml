---

- name: Insall node and npm 
  hosts: linode
  become: yes
  tasks:
    - name: Update apt and cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
        force_apt_get: yes
    - name: Install nodejs and npm
      apt:
        pkg:
          - nodejs
          - npm

- name: Create new linux user
  hosts: linode
  become: yes
  vars_files:
    - project-vars
  tasks:
    - name: Create a new user
      user:
        name: "{{ linux_name }}"
        state: present


- name: Deploy nodejs application
  hosts: linode
  vars_files:
    - project-vars
  become_user: "{{ linux_name }}"
  become: True
  tasks:


  # this is when we wantto copy the application files to the remote server and unpack them.
    # - name: Copy application files to remote server
    #   copy:
    #     src: /home/vicky/DevopsBootcamp/DevopsProjects/ansible/first_project/nodejs-app/nodejs-app-1.0.0.tgz
    #     dest: /root/app-1.0.0.tgz
    # - name: Unpack application files
    #   unarchive:
    #     src: /root/app-1.0.0.tgz
    #     dest: /root/
    #     remote_src: yes

    # but if we want to dicrlty unarchive the files from the local machine to the remote server we can use the below code.
    - name: Unpack application files
      unarchive:
        src: "{{ location }}/nodejs-app-{{ version }}.tgz"
        dest: "{{ user_home_dir }}"

    - name: Install application dependencies
      npm:
        path: "{{ user_home_dir }}/package"

    - name: Start the application
      command:
        cmd: node server
        chdir: "{{ user_home_dir }}/package/app"
      async: 1000  # Run the command asynchronously
      poll: 0  # Don't wait for the command to finish
    - name: ensure the application is running
      shell: "ps aux | grep 'node server' | grep -v grep"
      register: app_status #result of the command will be stored in app_status variable 
      failed_when: app_status.rc != 0
      changed_when: false
    - debug: msg={{app_status}}