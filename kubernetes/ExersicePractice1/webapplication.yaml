apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-application-deployment
  labels:
    app: web-application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-application
  template:
    metadata:
      labels:
        app: web-application
    spec:
      containers:
        - name: web-application
          image: ankit42098/testing-app:v1
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-root-user
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-root-password
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: mongo-config
                  key: mongo-data-base-url
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_INITDB_ROOT_USERNAME):$(MONGO_INITDB_ROOT_PASSWORD)@$(DATABASE_URL)"
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: mongo-config
                  key: mongo-port
---
apiVersion: v1
kind: Service
metadata:
  name: web-application-service
spec:
  type: LoadBalancer
  selector:
    app: web-application
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30000