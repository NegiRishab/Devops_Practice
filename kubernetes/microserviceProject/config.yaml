apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  labels:
    app: frontend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
        - name: frontend-service
          image: gcr.io/google-samples/microservices-demo/frontend:v0.8.0
          ports:
            - containerPort: 8080
          env:
          - name: PORT
            value: "8080"
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            value: product-catalog-service:7000
          - name: CURRENCY_SERVICE_ADDR
            value: currency-service:9000
          - name: AD_SERVICE_ADDR
            value: ad-service:11000
          - name: CART_SERVICE_ADDR
            value: cart-service:12000
          - name: CHECKOUT_SERVICE_ADDR
            value: checkout-service:14000
          - name: RECOMMENDATION_SERVICE_ADDR
            value: recommendation-service:6000
          - name: SHIPPING_SERVICE_ADDR
            value: shipping-service:10000
         
--- 
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer
  selector:
    app: frontend-service
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 8080
      nodePort: 30090

