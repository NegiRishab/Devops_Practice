apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-config
  labels:
    app: {{ .Values.appName }}
data:
  start-redis.sh: |
    #!/bin/sh
    set -e

    ORDINAL=${HOSTNAME##*-}

    if [ "$ORDINAL" = "0" ]; then
      echo "Starting as MASTER (pod $ORDINAL)"
      exec redis-server --dir {{ .Values.persistence.mountPath }}
    else
      echo "Starting as REPLICA (pod $ORDINAL)"
      exec redis-server --dir {{ .Values.persistence.mountPath }} \
        --replicaof {{ .Values.appName }}-0.{{ .Values.headlessService.name }} {{ .Values.headlessService.port }}
    fi