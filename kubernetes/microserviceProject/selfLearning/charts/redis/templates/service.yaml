apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.headlessService.name }}
spec:
  clusterIP: None
  selector:
    app: {{ .Values.appName }}
  ports:
    - name: redis
      protocol: TCP
      port: {{ .Values.headlessService.port }}
      targetPort: {{ .Values.containerPort }}
    

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.writableService.name }}
spec:
  type: {{ .Values.writableService.type }}
  selector:
    app: {{ .Values.appName }}
    statefulset.kubernetes.io/pod-name: {{ .Values.appName }}-0
  ports:
    - name: redis
      protocol: TCP
      port: {{ .Values.writableService.port }}
      targetPort: {{ .Values.writableService.targetPort }}