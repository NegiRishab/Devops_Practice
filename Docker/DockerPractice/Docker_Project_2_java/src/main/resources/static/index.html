<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superhero Collection</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Superhero Collection</h1>
            <p>Add heroes to your collection — name and power.</p>
        </header>

        <section class="card form-card">
            <h2>Add Superhero</h2>
            <form id="hero-form">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="e.g. Batman" required>
                </div>
                <div class="field">
                    <label for="power">Power</label>
                    <input type="text" id="power" name="power" placeholder="e.g. Genius intellect" required>
                </div>
                <button type="submit">Add to Collection</button>
            </form>
            <p id="message" class="message" hidden></p>
        </section>

        <section class="card">
            <h2>Your Collection</h2>
            <ul id="hero-list" class="hero-list">
                <li class="empty">Loading...</li>
            </ul>
        </section>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
